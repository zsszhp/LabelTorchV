[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labeltorch-backend"
version = "0.1.0"
description = "LabelTorch Python training backend"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.0",
    "onnxruntime>=1.15",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
anomaly = ["anomalib>=2.0"]
onnx = ["onnx"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
labeltorch-backend = "labeltorch_backend.server:main"
